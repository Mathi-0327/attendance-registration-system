version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# AttendReg Enterprise — Docker Compose
# Usage:
#   Development : docker compose up
#   Production  : docker compose -f docker-compose.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Application ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: attendreg:latest
    container_name: attendreg_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # JWT secrets — override in .env or secrets manager
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret}
      # Optional: switch to PostgreSQL by providing DATABASE_URL
      # DATABASE_URL: postgres://attendreg:secret@db:5432/attendreg
      # Notification services (optional — dev mode if missing)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      # AI (optional — fallback template if missing)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # SMTP (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes:
      # Persist SQLite database file
      - attendreg_data:/app/dist/data
    networks:
      - attendreg_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - redis

  # ── Redis (session store / queue) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: attendreg_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - attendreg_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx reverse proxy (optional, comment out for direct access) ─────────────
  nginx:
    image: nginx:alpine
    container_name: attendreg_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - attendreg_net
    depends_on:
      - app
    profiles:
      - production  # Only starts with: docker compose --profile production up

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  attendreg_data:
    name: attendreg_data
  redis_data:
    name: attendreg_redis_data
  nginx_logs:
    name: attendreg_nginx_logs

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  attendreg_net:
    name: attendreg_network
    driver: bridge
